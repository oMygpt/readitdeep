name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --extra dev
      # 起步只拦语法错误与未定义名，规则随改造逐步收紧
      - run: uv run ruff check --select E9,F63,F7,F82 app tests scripts
      - run: uv run pytest -q
